# Daily DSE report: refresh the price store, build the report, publish v1/*.json to the gh-pages branch (GitHub Pages).
# Secret ENGINE_TOKEN: a fine-grained read-only token (Contents: read) for pech-pech/cl (the engine, pinned engine-v1.1)
# and pech-pech/pnf-desktop (its `data` release holds the seed price snapshot).
name: daily-report

on:
  schedule:
    - cron: "50 10 * * 0-4"   # 16:50 Dhaka, Sun-Thu, after the close and AmarStock's end-of-day prices
    - cron: "30 12 * * 0-4"   # 18:30 Dhaka retry; --if-newer makes it a no-op when 16:50 already published
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but do not publish (the site is kept as a run artifact)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

env:
  DB: data/prices.sqlite3

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (engine from the private repo)
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          test -n "$ENGINE_TOKEN" || { echo "::error::Secret ENGINE_TOKEN is not set"; exit 1; }
          git config --global url."https://x-access-token:${ENGINE_TOKEN}@github.com/pech-pech/cl".insteadOf "https://github.com/pech-pech/cl"
          pip install .
          git config --global --unset-all url."https://x-access-token:${ENGINE_TOKEN}@github.com/pech-pech/cl".insteadOf

      - name: Restore the price store
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/prices.sqlite3
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Seed from the desktop app's snapshot (first run, or the cache expired)
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        run: |
          mkdir -p data
          gh release download data -R pech-pech/pnf-desktop -p prices.sqlite3.xz -D data
          xz -d data/prices.sqlite3.xz
          ls -l data

      - name: Refresh prices, sectors and company news
        id: refresh
        continue-on-error: true
        run: dsereport refresh --db "$DB"

      - name: Save the price store
        if: always() && hashFiles('data/prices.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: data/prices.sqlite3
          key: prices-${{ github.run_id }}

      - name: Check out the published site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            mkdir site && git -C site init -b gh-pages && git -C site remote add origin "$url"
          fi
          touch site/.nojekyll

      - name: Build the report
        run: dsereport build --db "$DB" --out site --if-newer

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to publish"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "report $(python -c 'import json;print(json.load(open("v1/latest.json"))["asOf"])')"
          git push -q origin gh-pages

      - name: Keep the site (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/v1/

      - name: Refresh failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::The engine refresh failed; the report was built from the stored sessions (see the refresh step)"
          exit 1
