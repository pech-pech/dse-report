plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pechpech.dsereport'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pechpech.dsereport'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        // where the daily report is published (GitHub Pages of pech-pech/dse-report)
        buildConfigField 'String', 'REPORT_URL', '"https://pech-pech.github.io/dse-report/v1/latest.json"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
        }
    }
    testOptions { unitTests.returnDefaultValues = false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'          // WebViewAssetLoader
    implementation 'androidx.work:work-runtime-ktx:2.9.1'   // the daily download
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'             // the real org.json on the JVM (Android's is a stub there)
}
